services:
  db:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-mongo_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Define MONGO_ROOT_PASSWORD en .env}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-autoescuela}
      MONGO_APP_USER: ${MONGO_APP_USER:-autoescuela_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Define MONGO_APP_PASSWORD en .env}
    volumes:
      - mongo_data:/data/db
      - ./backend/mongo-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27017}:27017"
    healthcheck:
      test:
        - CMD-SHELL
        - 'mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand(\"ping\").ok"'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [database]

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      MONGO_HOST: db
      MONGO_PORT: "27017"
      MONGO_DB_NAME: ${MONGO_DB_NAME:-autoescuela}
      MONGO_APP_USER: ${MONGO_APP_USER:-autoescuela_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Define MONGO_APP_PASSWORD en .env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - '$$socket = @fsockopen("127.0.0.1", 80); if (!$$socket) exit(1); fwrite($$socket, "GET /api/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n"); $$response = stream_get_contents($$socket); fclose($$socket); exit(str_contains($$response, "200 OK") ? 0 : 1);'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - frontend
      - database

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - frontend

volumes:
  mongo_data:

networks:
  frontend:
  database:
    internal: true
